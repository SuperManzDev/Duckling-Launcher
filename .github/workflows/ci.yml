name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux libraries (voice chat's ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run cargo test
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
        shell: bash
      - name: Report test summary
        if: always()
        run: |
          if [ -f test-output.txt ]; then
            echo "### Test Output (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILED|failures:|panicked at" -B 2 -A 10 test-output.txt | head -n 120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

  # The in-game client: its shared core's tests, then every Minecraft target compiled and
  # its mixin hooks checked against that version's game jar (no game is started).
  mod-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Live video integration tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: chmod +x mod/gradlew && mod/gradlew -p mod/core test

  mod-targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "versions=$(jq -c '[.[].build]' mod/targets.json)" >> "$GITHUB_OUTPUT"

  mod:
    needs: mod-targets
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.mod-targets.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mod/gradlew && python3 mod/check.py ${{ matrix.version }}
